<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 960 1145"
  role="img"
  aria-labelledby="svg-title svg-desc"
>
<title id="svg-title">IAM-02 LedgerFlow Identity Architecture</title>
<desc id="svg-desc">LedgerFlow architecture covering SAML federation, OpenID Connect and OAuth authorization code with PKCE, Microsoft Graph delegated access, and SCIM provisioning.</desc>

<style>
.bg {
  fill: #161b21;
}
.panel {
  fill: #12161b;
  stroke: #655236;
  stroke-width: 1;
}
.node {
  fill: #1b1916;
  stroke: #9c7433;
  stroke-width: 1.2;
}
.title {
  fill: #efcf88;
  font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  text-anchor: middle;
}
.label {
  fill: #f2eee7;
  font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  text-anchor: middle;
}
.sub {
  fill: #a89f92;
  font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  text-anchor: middle;
}
.note {
  fill: #a89f92;
  font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.arrow {
  stroke: #d4aa55;
  stroke-width: 2.5;
  fill: none;
}
</style>

